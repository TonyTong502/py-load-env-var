# This is a basic workflow to help you get started with Actions

name: cpi-sync

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # environment
    environment: dev
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: set branch name
        run: echo "BRANCH_NAME=sync/$(date +'%Y%m%dT%H%M%S')" >> $GITHUB_ENV
      - name: create new branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
      # Setup Python
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: 3.12
      - run: pip install requests
      - run: python .github/python_scripts/ipg_sync_tenant.py
        env:
          service_key: ${{ secrets.service_key }}
          package_ids_to_be_downloaded: ${{ vars.package_ids_to_be_downloaded }}
      - name: push new branch
        run: |
          git add .
          git commit -m "sync up on $(date +'%Y%m%dT%H%M%S')"
          git push origin $BRANCH_NAME
          
